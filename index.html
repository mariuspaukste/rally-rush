<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Rally Rush</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #24401f; color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  #gl, #c { display: block; position: fixed; inset: 0; touch-action: none; }
  #c { pointer-events: none; }
  #hud {
    position: fixed; top: 10px; left: 10px; z-index: 2; pointer-events: none;
    background: rgba(0,0,0,.45); border-radius: 10px; padding: 8px 12px; min-width: 150px;
    font-variant-numeric: tabular-nums; line-height: 1.35; display: none;
  }
  #hud .big { font-size: 22px; font-weight: 800; }
  #hud .big span { font-size: 14px; opacity: .7; }
  #hud .small { font-size: 12px; opacity: .85; }
  #hud .dmg { display: flex; align-items: center; gap: 6px; font-size: 11px; margin-top: 3px; }
  #hud .dmg .bar { flex: 1; }
  #pauseBtn {
    position: fixed; top: 10px; right: 10px; z-index: 3; display: none;
    width: 40px; height: 40px; border-radius: 10px; border: 0;
    background: rgba(0,0,0,.45); color: #fff; font-size: 18px; font-weight: 800; cursor: pointer;
  }
  .overlay {
    position: fixed; inset: 0; z-index: 5; display: none; align-items: center; justify-content: center;
    background: rgba(8,14,8,.45); padding: 16px; overflow-y: auto;
  }
  .overlay.show { display: flex; }
  .panel {
    background: #1f2a22; border: 1px solid #3a4c3e; border-radius: 16px; padding: 20px;
    width: min(100%, 440px); box-shadow: 0 12px 40px rgba(0,0,0,.5); margin: auto;
  }
  .panel.wide { width: min(100%, 540px); }
  .panel h1 { margin: 0 0 2px; font-size: 34px; letter-spacing: 1px; font-style: italic; font-weight: 900; }
  .panel h1 span, .hl { color: #ffcc33; }
  .panel h2 { margin: 0 0 10px; }
  .sub { color: #a9b8ab; font-size: 13px; margin: 0 0 14px; line-height: 1.45; }
  .label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #a9b8ab; margin: 14px 0 6px; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; }
  .opt {
    flex: 1; min-width: 0; padding: 9px 6px; border-radius: 9px; border: 1px solid #3a4c3e;
    background: #29372c; color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; text-align: center;
  }
  .opt small { display: block; font-weight: 400; color: #a9b8ab; font-size: 11px; margin-top: 2px; }
  .opt.on { background: #ffcc33; color: #1a1a1a; border-color: #ffcc33; }
  .opt.on small { color: #4a3d00; }
  .swatch { flex: 0 0 34px; height: 34px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; box-shadow: 0 0 0 1px rgba(0,0,0,.4) inset; }
  .swatch.on { border-color: #fff; }
  .go {
    display: block; width: 100%; margin-top: 16px; padding: 13px; border: 0; border-radius: 11px;
    background: #ffcc33; color: #1a1a1a; font-size: 17px; font-weight: 800; cursor: pointer; font-family: inherit;
  }
  .go.alt { background: #29372c; color: #fff; border: 1px solid #3a4c3e; margin-top: 8px; }
  .go:disabled { opacity: .45; cursor: default; }
  .keys { color: #a9b8ab; font-size: 12px; margin-top: 14px; line-height: 1.5; }
  .sel { display: flex; align-items: center; gap: 8px; }
  .sel button {
    flex: 0 0 42px; height: 42px; border-radius: 10px; border: 1px solid #3a4c3e; background: #29372c;
    color: #fff; font-size: 18px; cursor: pointer;
  }
  .sel .val { flex: 1; text-align: center; font-weight: 700; font-size: 15px; }
  .sel .val small { display: block; font-weight: 400; color: #a9b8ab; font-size: 12px; margin-top: 2px; }
  .stats { display: grid; grid-template-columns: 52px 1fr; gap: 4px 8px; font-size: 11px; color: #a9b8ab; margin-top: 8px; align-items: center; }
  .bar { height: 7px; background: #111b14; border-radius: 4px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: #ffcc33; border-radius: 4px; }
  .money { color: #7ee081; font-weight: 800; }
  .card { border: 1px solid #3a4c3e; border-radius: 12px; padding: 10px 12px; margin-top: 8px; background: #243028; }
  .card.cur { border-color: #ffcc33; }
  .card.lock { opacity: .5; }
  .card .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .card .top b { font-size: 15px; }
  .card .top small { display: block; color: #a9b8ab; font-size: 12px; font-weight: 400; }
  .sbtn {
    padding: 8px 12px; border-radius: 9px; border: 0; background: #ffcc33; color: #1a1a1a; font-weight: 800;
    font-size: 13px; cursor: pointer; white-space: nowrap; font-family: inherit;
  }
  .sbtn.alt { background: #29372c; color: #fff; border: 1px solid #3a4c3e; }
  .sbtn:disabled { opacity: .4; cursor: default; }
  .btnrow { display: flex; gap: 8px; margin-top: 8px; }

  .note { background: #2d2a17; border: 1px solid #5c5320; color: #ffe08a; border-radius: 10px; padding: 8px 10px; font-size: 13px; margin-top: 10px; }

</head>
<body>
<canvas id="gl"></canvas>
<canvas id="c"></canvas>
<div id="hud"></div>
<button id="pauseBtn" aria-label="Pause">II</button>
<div id="touch">

  </div>
  <canvas id="edCanvas"></canvas>
  <div id="edStatus"></div>
</div>

<script>
// ===== SIM-START =====
const SAMPLE = 10, MAXV = 430, ACC = 340, BRAKE = 640, REV = 140, TURN = 3.0, GRAV = 900;

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
function wrapA(a) { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; }
function seeded(seed) {
  seed = (Math.abs(Math.floor(seed)) % 2147483646) + 1;
  return () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
}
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

// ---------- surfaces ----------
const PATCHES = {
  water:  { name: 'Water',  slow: true, col: '#3f7fb0', edge: '#2c5d84' },
  mud:    { name: 'Mud',    slow: true, col: '#4a3423', edge: '#33241a' },
  sand:   { name: 'Soft sand', slow: true, col: '#ecd39a', edge: '#d9bb7c' },
  ice:    { name: 'Ice',    slip: true, col: '#cfeefc', edge: '#9fd6ef' },
  gravel: { name: 'Gravel', slip: true, col: '#8a7563', edge: '#6e5b4b' },
  oil:    { name: 'Oil',    slip: true, col: '#1d1d22', edge: '#000000' },
};

const THEMES = {
  meadow:   { name: 'Meadow', ground: '#55a03f', dark: 'rgba(30,70,25,.3)', light: 'rgba(150,200,95,.22)', outer: '#2f5a26',
              verge: '#6f5236', edge: '#7d5e3d', road: '#a5815a', grip: 1.0, offV: 0.42, offDrag: 1.6, offGrip: 0.6,
              patch: 'water', barrier: 'bales', flora: ['tree', 'tree', 'pine', 'bush'] },
  desert:   { name: 'Desert', ground: '#dcb877', dark: 'rgba(150,100,40,.18)', light: 'rgba(255,240,200,.25)', outer: '#c79f5f',
              verge: '#b78a55', edge: '#a87b49', road: '#c79a63', grip: 0.95, offV: 0.36, offDrag: 1.9, offGrip: 0.55,
              patch: 'sand', barrier: 'tyres', flora: ['cactus', 'cactus', 'rock', 'rock'] },
  snow:     { name: 'Snow', ground: '#eef3f7', dark: 'rgba(150,180,205,.22)', light: 'rgba(255,255,255,.6)', outer: '#dbe5ec',
              verge: '#d5dee6', edge: '#aebbc6', road: '#bfcad3', grip: 0.72, offV: 0.42, offDrag: 1.5, offGrip: 0.45,
              patch: 'ice', barrier: 'snow', flora: ['snowpine', 'snowpine', 'snowpine', 'rock'] },
  swamp:    { name: 'Swamp', ground: '#5b6b33', dark: 'rgba(30,40,15,.35)', light: 'rgba(140,160,80,.2)', outer: '#3a4720',
              verge: '#4f4128', edge: '#5d4c30', road: '#7a6440', grip: 0.9, offV: 0.36, offDrag: 2.0, offGrip: 0.55,
              patch: 'mud', barrier: 'bales', flora: ['deadtree', 'willow', 'willow', 'bush'] },
  canyon:   { name: 'Canyon', ground: '#bd6c3e', dark: 'rgba(110,40,15,.25)', light: 'rgba(240,170,110,.22)', outer: '#8d4a2a',
              verge: '#a6643c', edge: '#b9774a', road: '#d8a671', grip: 0.97, offV: 0.4, offDrag: 1.7, offGrip: 0.6,
              patch: 'gravel', barrier: 'tyres', flora: ['rock', 'rock', 'pillar', 'cactus'] },
  speedway: { name: 'Speedway', ground: '#4f9a3c', dark: 'rgba(30,70,25,.3)', light: 'rgba(140,190,90,.22)', outer: '#2b5424',
              verge: '#c9b48a', edge: '#f2f2f2', road: '#5b5e62', curbs: true, grip: 1.05, offV: 0.4, offDrag: 1.6, offGrip: 0.6,
              patch: 'oil', barrier: 'tyres', flora: ['tree', 'pine', 'tree'] },
};

// ---------- tracks: 10 layouts, each raced both ways = 20 tracks ----------
const LAYOUTS = [
  { name: 'Green Meadows', theme: 'meadow', note: 'Easy', width: 165,
    points: [[1200,300],[2000,400],[2150,900],[1900,1400],[1200,1500],[500,1400],[300,900],[400,400]] },
  { name: 'Dune Run', theme: 'desert', note: 'Easy', width: 160,
    points: [[1100,350],[1700,600],[2200,400],[2250,1000],[1800,1500],[1250,1200],[700,1550],[300,1100],[400,500]] },
  { name: 'Hairpin Hills', theme: 'meadow', note: 'Medium', width: 150,
    points: [[1000,250],[1300,650],[1700,300],[2150,450],[2150,1000],[1600,1100],[1850,1500],
             [1150,1600],[950,1150],[550,1550],[250,1050],[300,300]] },
  { name: 'Bog Trotter', theme: 'swamp', note: 'Medium', width: 150,
    points: [[1100,300],[1500,700],[2150,350],[2250,1100],[1750,1050],[1500,1550],[900,1600],[1000,1050],[400,1300],[350,350]] },
  { name: 'Snake River', theme: 'swamp', note: 'Hard', width: 140,
    points: [[300,900],[300,300],[800,300],[880,950],[1300,950],[1300,300],[2150,300],[2150,1000],
             [1750,1100],[2150,1550],[1150,1650],[700,1250],[300,1500]] },
  { name: 'Frostbite Pass', theme: 'snow', note: 'Medium', width: 160,
    points: [[1200,500],[1800,250],[2200,700],[1900,1100],[2200,1550],[1400,1650],[1000,1150],[600,1600],[300,800],[600,300]] },
  { name: 'Cactus Canyon', theme: 'canyon', note: 'Medium', width: 150,
    points: [[900,300],[1100,700],[1500,300],[2200,350],[2100,900],[2250,1450],[1600,1600],[1300,1200],
             [900,1600],[300,1500],[500,950],[300,400]] },
  { name: 'Red Rock Loop', theme: 'canyon', note: 'Fast', width: 155,
    points: [[1300,450],[1600,250],[2200,500],[2000,1000],[2250,1500],[1500,1450],[1100,1650],[600,1550],[300,1000],[500,350]] },
  { name: 'Glacier Gorge', theme: 'snow', note: 'Hard', width: 145,
    points: [[1100,650],[1500,250],[2200,300],[2250,900],[1800,950],[1400,1200],[2000,1640],[1100,1650],[800,1100],
             [300,1600],[250,900],[600,300]] },
  { name: 'Thunder Bowl', theme: 'speedway', note: 'Fast', width: 165,
    points: [[1200,320],[1700,300],[2200,700],[2150,1300],[1600,1600],[700,1550],[300,900],[700,350]] },
];

const TRACKS = [];
LAYOUTS.forEach((L, i) => TRACKS.push({ name: L.name, layout: i, rev: false, theme: L.theme }));
LAYOUTS.forEach((L, i) => TRACKS.push({ name: L.name + ' Rev', layout: i, rev: true, theme: L.theme }));

function trackDef(i) {
  const T = TRACKS[i], L = LAYOUTS[T.layout];
  const pts = T.rev ? [L.points[0]].concat(L.points.slice(1).reverse()) : L.points;
  return { name: T.name, theme: L.theme, width: L.width, points: pts, seed: 101 + i * 37 };
}

// ---------- cars ----------
const CARS = [
  { name: 'Sand Flea',    style: 'buggy', price: 1500,  speed: 0.86, accel: 0.95, grip: 0.95, armor: 0.75, mass: 0.8 },
  { name: 'Mud Hatch',    style: 'hatch', price: 3500,  speed: 0.90, accel: 0.95, grip: 1.00, armor: 1.00, mass: 1.0 },
  { name: 'Ridge Jeep',   style: 'jeep',  price: 5500,  speed: 0.89, accel: 0.90, grip: 0.95, armor: 1.50, mass: 1.3 },
  { name: 'Dust Devil',   style: 'buggy', price: 7500,  speed: 0.97, accel: 1.08, grip: 1.00, armor: 0.80, mass: 0.8 },
  { name: 'Rally Hatch R', style: 'hatch', price: 10000, speed: 0.99, accel: 1.00, grip: 1.10, armor: 1.00, mass: 1.0 },
  { name: 'Bull Pickup',  style: 'truck', price: 13000, speed: 0.96, accel: 0.92, grip: 0.92, armor: 1.90, mass: 1.6 },
  { name: 'Comet Coupe',  style: 'coupe', price: 17000, speed: 1.04, accel: 1.05, grip: 1.08, armor: 0.90, mass: 1.0 },
  { name: 'Thunder Jeep', style: 'jeep',  price: 22000, speed: 1.03, accel: 1.00, grip: 1.02, armor: 1.60, mass: 1.3 },
  { name: 'Sidewinder',   style: 'buggy', price: 29000, speed: 1.10, accel: 1.18, grip: 1.10, armor: 0.80, mass: 0.8 },
  { name: 'Goliath',      style: 'truck', price: 38000, speed: 1.08, accel: 1.02, grip: 1.00, armor: 2.20, mass: 1.7 },
];
const CAR_R = { buggy: 14, hatch: 15, coupe: 16, jeep: 16, truck: 17 };

const COLORS = [
  { hex: '#e53935', name: 'Red' }, { hex: '#1e88e5', name: 'Blue' }, { hex: '#fdd835', name: 'Yellow' },
  { hex: '#43a047', name: 'Green' }, { hex: '#fb8c00', name: 'Orange' }, { hex: '#8e24aa', name: 'Purple' },
  { hex: '#00acc1', name: 'Cyan' }, { hex: '#ec407a', name: 'Pink' }, { hex: '#eceff1', name: 'White' },
  { hex: '#37474f', name: 'Black' },
];
const NAMES = ['Rusty', 'Blaze', 'Mona', 'Dex', 'Vito', 'Kira', 'Tank', 'Jinx', 'Ozzy', 'Luna',
               'Spike', 'Nina', 'Bruno', 'Zara', 'Duke', 'Rosa', 'Hank', 'Pixie', 'Grit', 'Talia'];

// how the rivals drive: from Peaceful (no contact) to Brutal (they come for you)
const STYLES = [
  { name: 'Peaceful',   note: 'No ramming',   skill: 0.84, aggr: 0,    dmg: 0.4 },
  { name: 'Normal',     note: 'Some bumping', skill: 0.91, aggr: 0.3,  dmg: 1.0 },
  { name: 'Aggressive', note: 'Rams often',   skill: 0.95, aggr: 0.65, dmg: 1.1 },
  { name: 'Brutal',     note: 'Out for blood', skill: 0.985, aggr: 1,  dmg: 1.25 },
];

// ---------- track building ----------
function buildTrack(def) {
  const P = def.points, n = P.length, dense = [];
  for (let i = 0; i < n; i++) {
    const p0 = P[(i - 1 + n) % n], p1 = P[i], p2 = P[(i + 1) % n], p3 = P[(i + 2) % n];
    for (let s = 0; s < 60; s++) {
      const t = s / 60, t2 = t * t, t3 = t2 * t;
      const f = k => 0.5 * (2 * p1[k] + (-p0[k] + p2[k]) * t + (2 * p0[k] - 5 * p1[k] + 4 * p2[k] - p3[k]) * t2 +
        (-p0[k] + 3 * p1[k] - 3 * p2[k] + p3[k]) * t3);
      dense.push([f(0), f(1)]);
    }
  }
  const pts = [dense[0].slice()];
  let prev = dense[0], acc = 0;
  for (let i = 1; i <= dense.length; i++) {
    const cur = dense[i % dense.length];
    let seg = Math.hypot(cur[0] - prev[0], cur[1] - prev[1]);
    while (acc + seg >= SAMPLE) {
      const t = (SAMPLE - acc) / seg;
      const np = [prev[0] + (cur[0] - prev[0]) * t, prev[1] + (cur[1] - prev[1]) * t];
      pts.push(np); prev = np; acc = 0;
      seg = Math.hypot(cur[0] - prev[0], cur[1] - prev[1]);
    }
    acc += seg; prev = cur;
  }
  const last = pts[pts.length - 1];
  if (Math.hypot(last[0] - pts[0][0], last[1] - pts[0][1]) < SAMPLE * 0.6) pts.pop();
  const N = pts.length, ang = new Array(N), turn = new Array(N);
  for (let i = 0; i < N; i++) {
    const a = pts[(i - 1 + N) % N], b = pts[(i + 1) % N];
    ang[i] = Math.atan2(b[1] - a[1], b[0] - a[0]);
  }
  for (let i = 0; i < N; i++) turn[i] = Math.abs(wrapA(ang[(i + 24) % N] - ang[i]));
  let minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;
  for (const p of pts) { minX = Math.min(minX, p[0]); minY = Math.min(minY, p[1]); maxX = Math.max(maxX, p[0]); maxY = Math.max(maxY, p[1]); }
  const m = 260;
  const tr = { name: def.name, width: def.width, theme: THEMES[def.theme] ? def.theme : 'meadow', pts, ang, turn, N,
    bounds: { x0: minX - m, y0: minY - m, x1: maxX + m, y1: maxY + m } };
  decorate(tr, def.seed ?? hashStr(JSON.stringify(def.points)));
  return tr;
}

const cyc = (N, i, j) => { const d = Math.abs(i - j) % N; return Math.min(d, N - d); };

// ramps, surface patches and pickups, placed from a seed so every track is the same each time
function decorate(tr, seed) {
  const rnd = seeded(seed), N = tr.N, hw = tr.width / 2;
  const far = (i, list, gap) => list.every(j => cyc(N, i, j) > gap);
  const at = (i, lat) => { const a = tr.ang[i]; return [tr.pts[i][0] - Math.sin(a) * lat, tr.pts[i][1] + Math.cos(a) * lat]; };
  // jumps go on straights with a straight run-out after them
  let cands = [];
  for (const lim of [0.3, 0.45, 0.65]) {
    for (let i = 0; i < N; i++) {
      let ok = true;
      for (let k = -10; k <= 30 && ok; k += 2) if (tr.turn[(i + k + N) % N] > lim) ok = false;
      if (ok && far(i, [0], 50)) cands.push(i);
    }
    if (cands.length > 10) break;
    cands = [];
  }
  const ramps = [], rampIdx = [];
  for (let tries = 0; tries < 40 && cands.length && ramps.length < (N > 420 ? 2 : 1); tries++) {
    const i = cands[Math.floor(rnd() * cands.length)];
    if (!far(i, rampIdx, N / 3)) continue;
    rampIdx.push(i);
    ramps.push({ i, x: tr.pts[i][0], y: tr.pts[i][1], a: tr.ang[i], len: 36, h: 13 });
  }
  // patches of mud, ice, water...
  const kind = THEMES[tr.theme].patch, patches = [], pIdx = [];
  for (let tries = 0; tries < 80 && patches.length < 4; tries++) {
    const i = Math.floor(rnd() * N);
    if (!far(i, [0], 40) || !far(i, rampIdx, 40) || !far(i, pIdx, N / 7)) continue;
    pIdx.push(i);
    const r = 24 + rnd() * 18, p = at(i, (rnd() - 0.5) * hw * 0.8);
    patches.push({ x: p[0], y: p[1], r, kind, seed: Math.floor(rnd() * 1e6) });
  }
  // pickups: cash, nitro, repair
  const types = ['cash', 'nitro', 'cash', 'wrench', 'nitro', 'cash'], pickups = [];
  for (let k = 0; k < 6; k++) {
    let i = Math.floor((k + 0.5) * N / 6 + (rnd() - 0.5) * N / 14);
    for (let s = 0; s < 6 && (!far(i, rampIdx, 22) || !far(i, [0], 25)); s++) i = (i + 15) % N;
    const p = at((i + N) % N, (rnd() - 0.5) * hw * 0.9);
    pickups.push({ x: p[0], y: p[1], type: types[k] });
  }
  tr.ramps = ramps; tr.patches = patches; tr.pickupSpots = pickups;
}

// finds where a track folds back over itself (used by the editor and the tests)
function trackOverlaps(tr) {
  const gap = Math.ceil((tr.width + 70) * 1.7 / SAMPLE), lim = tr.width + 24, bad = [];
  for (let i = 0; i < tr.N; i += 2) for (let j = i + gap; j < tr.N; j += 2) {
    if (cyc(tr.N, i, j) <= gap) continue;
    const a = tr.pts[i], b = tr.pts[j];
    if ((a[0] - b[0]) ** 2 + (a[1] - b[1]) ** 2 < lim * lim) { bad.push(i); break; }
  }
  return bad;
}

function nearest(tr, x, y, guess, win) {
  let best = guess, bd = 1e18;
  for (let k = -win; k <= win; k++) {
    const i = (guess + k + tr.N) % tr.N, p = tr.pts[i];
    const d = (p[0] - x) * (p[0] - x) + (p[1] - y) * (p[1] - y);
    if (d < bd) { bd = d; best = i; }
  }
  return { i: best, d: Math.sqrt(bd) };
}

// ---------- races ----------
function quickEntrants(opts, rand) {
  const pc = opts.color ?? 0, carI = opts.car ?? 0, st = STYLES[opts.style ?? 1];
  const cols = COLORS.map((c, i) => i).filter(i => i !== pc);
  const names = NAMES.slice().sort(() => rand() - 0.5);
  const out = [];
  for (let k = 0; k < 5; k++) {
    out.push({ name: names[k], color: COLORS[cols[k]].hex, isPlayer: false,
      car: clamp(carI + Math.round((rand() - 0.5) * 4), 0, CARS.length - 1),
      skill: st.skill * (1 - 0.02 * k + rand() * 0.02) });
  }
  out.push({ name: 'You', color: COLORS[pc].hex, isPlayer: true, car: carI, dmg: 0 });
  return out;
}

function makeRace(tr, opts) {
  const rand = opts.rand || Math.random, style = STYLES[opts.style ?? 1];
  const ents = opts.entrants || quickEntrants(opts, rand), cars = [];
  ents.forEach((e, k) => {
    const row = Math.floor(k / 2), col = k % 2;
    const idx = (tr.N - 4 - row * 8) % tr.N;
    const a = tr.ang[idx], nx = -Math.sin(a), ny = Math.cos(a);
    const lat = (col ? 1 : -1) * tr.width * 0.22, spec = CARS[e.car] || CARS[0];
    cars.push({
      x: tr.pts[idx][0] + nx * lat, y: tr.pts[idx][1] + ny * lat, a, vx: 0, vy: 0, z: 0, vz: 0,
      color: e.color, name: e.name, isPlayer: !!e.isPlayer, carIdx: e.car, spec, r: CAR_R[spec.style] || 15,
      idx, laps: -1, maxLap: -1, lapStart: 0, lapTimes: [], finishTime: null,
      lane: lat * 0.6, laneT: 0, skill: e.skill || style.skill, stuckT: 0, revT: 0, off: false, steerS: 0, lat: 0,
      dmg: e.dmg || 0, nitro: 0, boostT: 0, nitroHeld: false, cash: 0, rampIn: null, rampH: 0, surf: 'road', hitT: 0,
    });
  });
  return { track: tr, cars, laps: opts.laps || 3, t: 0, state: 'countdown', cd: 3.2,
    finishOrder: [], skids: [], events: [], autoPlayer: !!opts.autoPlayer, rand, style, dmgMul: style.dmg,
    solids: opts.solids || [], cashValue: opts.cashValue || 100,
    pickups: (tr.pickupSpots || []).map(p => Object.assign({ t: 0 }, p)) };
}

function progress(race, car) { return car.laps * race.track.N + car.idx; }

function hurt(race, car, amt) {
  if (amt <= 0.3 || car.finishTime != null) return;
  car.dmg = Math.min(100, car.dmg + amt * race.dmgMul / car.spec.armor);
  car.hitT = 0.35;
}

function aiControl(race, car, dt) {
  const tr = race.track, N = tr.N, st = race.style, th = THEMES[tr.theme];
  const fx = Math.cos(car.a), fy = Math.sin(car.a);
  const fwd = car.vx * fx + car.vy * fy, sp = Math.abs(fwd);
  car.laneT -= dt;
  if (car.laneT <= 0) {
    car.laneT = 2 + race.rand() * 3; car.laneTarget = (race.rand() - 0.5) * tr.width * 0.45;
    car.bully = race.rand() < st.aggr;
  }
  let goal = car.laneTarget ?? car.lane, rate = 0.8, chase = null;
  // look at nearby cars: bully them, or go round them
  const p = tr.pts[car.idx], a0 = tr.ang[car.idx], nx = -Math.sin(a0), ny = Math.cos(a0);
  let best = null, bd = 1e9;
  if (car.finishTime == null) for (const o of race.cars) {
    if (o === car || o.finishTime != null || Math.abs(o.z - car.z) > 10) continue;
    const dx = o.x - car.x, dy = o.y - car.y, d = Math.hypot(dx, dy);
    if (d > 210 || dx * fx + dy * fy < -25) continue;
    const w = d * (o.isPlayer ? 0.7 : 1);
    if (w < bd) { bd = w; best = o; }
  }
  if (best) {
    const ol = (best.x - p[0]) * nx + (best.y - p[1]) * ny, ml = (car.x - p[0]) * nx + (car.y - p[1]) * ny;
    const d = Math.hypot(best.x - car.x, best.y - car.y);
    if (car.bully && st.aggr > 0) {
      goal = ol; rate = 2 + 3 * st.aggr;
      if (d < 80 + 50 * st.aggr) chase = best;
    } else if (d < 130) {
      goal = ol + (ml >= ol ? 1 : -1) * (best.r + car.r + 16); rate = 2.2;
    }
  }
  goal = clamp(goal, -tr.width * 0.42, tr.width * 0.42);
  car.lane += (goal - car.lane) * Math.min(1, dt * rate);
  const look = 9 + Math.floor(sp / 30);
  const ti = (car.idx + look) % N, ta = tr.ang[ti];
  let tx = tr.pts[ti][0] - Math.sin(ta) * car.lane, ty = tr.pts[ti][1] + Math.cos(ta) * car.lane;
  // good drivers steer round mud and ice
  if (car.skill > 0.9) for (const pa of tr.patches) {
    const dx = tx - pa.x, dy = ty - pa.y, d = Math.hypot(dx, dy), need = pa.r + car.r + 6;
    if (d < need && d > 0.01) { tx = pa.x + dx / d * need; ty = pa.y + dy / d * need; }
  }
  if (chase) {
    const cx = chase.x + chase.vx * 0.15, cy = chase.y + chase.vy * 0.15;
    if (Math.abs(wrapA(Math.atan2(cy - car.y, cx - car.x) - car.a)) < 0.7) { tx = cx; ty = cy; } else chase = null;
  }
  const diff = wrapA(Math.atan2(ty - car.y, tx - car.x) - car.a);
  const steer = clamp(diff * 2.8, -1, 1);
  if (car.revT > 0) return { throttle: false, brake: true, steer: -steer, hb: false };
  const bi = (car.idx + 5 + Math.floor(sp / 24)) % N;
  const tn = Math.max(tr.turn[bi], tr.turn[(bi + 6) % N]) / Math.min(1, th.grip + 0.1);
  const health = car.dmg >= 100 ? 0.45 : 1 - 0.3 * car.dmg / 100;
  let target = MAXV * car.spec.speed * health * car.skill * (1 - Math.min(0.62, tn * 0.5));
  if (car.boostT > 0) target *= 1.3;
  if (car.off) target = Math.min(target, MAXV * th.offV);
  if (chase) target = Math.max(target, fwd + 60);
  if (car.finishTime != null) target *= 0.6;
  let nitro = false;
  if (car.nitro > 0 && car.boostT <= 0 && !car.off && car.finishTime == null) {
    let straight = true;
    for (let k = 0; k < 40 && straight; k += 4) if (tr.turn[(car.idx + k) % N] > 0.3) straight = false;
    if (straight && race.rand() < dt * 1.5) nitro = true;
  }
  return { throttle: fwd < target, brake: fwd > target + 30, steer, hb: false, nitro };
}

function surfaceAt(tr, x, y) {
  for (const p of tr.patches) { const dx = x - p.x, dy = y - p.y; if (dx * dx + dy * dy < p.r * p.r) return p.kind; }
  return null;
}

function physics(race, car, ctl, dt) {
  const tr = race.track, th = THEMES[tr.theme], spec = car.spec;
  car.steerS += ((ctl.steer || 0) - car.steerS) * Math.min(1, dt * 10);
  if (ctl.nitro && !car.nitroHeld && car.nitro > 0 && car.boostT <= 0) { car.nitro--; car.boostT = 1.6; }
  car.nitroHeld = !!ctl.nitro;
  if (car.boostT > 0) car.boostT -= dt;
  if (car.hitT > 0) car.hitT -= dt;
  let fx = Math.cos(car.a), fy = Math.sin(car.a);
  let fwd = car.vx * fx + car.vy * fy, lat = car.vx * -fy + car.vy * fx;
  const air = car.z > 0, boost = car.boostT > 0;
  const health = car.dmg >= 100 ? 0.45 : 1 - 0.3 * car.dmg / 100;
  const topV = MAXV * spec.speed * health * (boost ? 1.3 : 1);
  car.surf = air ? 'air' : car.off ? 'off' : (surfaceAt(tr, car.x, car.y) || 'road');
  let maxF = topV, drag = 0.35, grip = 9 * spec.grip * th.grip, acc = ACC * spec.accel * (boost ? 2 : 1);
  if (car.surf === 'off') {
    maxF = Math.min(topV, MAXV * th.offV * (boost ? 1.3 : 1)); drag = th.offDrag; grip = 9 * spec.grip * th.offGrip; acc *= 0.7;
  } else if (PATCHES[car.surf]) {
    const P = PATCHES[car.surf];
    if (P.slow) { maxF = Math.min(maxF, topV * 0.5); drag = 2.0; }
    if (P.slip) { grip *= 0.16; drag = 0.2; }
  }
  if (!air) {
    if (ctl.throttle && fwd < maxF) fwd += acc * dt;
    if (ctl.brake) {
      if (fwd > 5) fwd -= BRAKE * dt;
      else if (fwd > -REV) fwd -= ACC * 0.6 * dt;
    }
    fwd -= fwd * drag * dt;
    if (!ctl.throttle && !ctl.brake) fwd -= Math.sign(fwd) * Math.min(Math.abs(fwd), 70 * dt);
    if (fwd > maxF) fwd += (maxF - fwd) * Math.min(1, 2.5 * dt);
    lat *= Math.exp(-(ctl.hb ? 1.8 : grip) * dt);
    const sp = Math.abs(fwd);
    const turnRate = TURN * Math.min(1, sp / 110) * (1 - 0.3 * Math.min(1, sp / MAXV)) * (ctl.hb ? 1.35 : 1);
    car.a = wrapA(car.a + car.steerS * turnRate * (fwd >= 0 ? 1 : -1) * dt);
  } else {
    fwd -= fwd * 0.05 * dt;
    car.vz -= GRAV * dt; car.z += car.vz * dt;
    if (car.z <= 0) {
      if (car.vz < -300) hurt(race, car, (-car.vz - 300) * 0.03);
      car.z = 0; car.vz = 0;
    }
  }
  fx = Math.cos(car.a); fy = Math.sin(car.a);
  car.vx = fx * fwd - fy * lat; car.vy = fy * fwd + fx * lat;
  car.x += car.vx * dt; car.y += car.vy * dt;
  car.lat = lat;
  const b = tr.bounds;
  if (car.x < b.x0) { car.x = b.x0; car.vx = Math.abs(car.vx) * 0.3; }
  if (car.x > b.x1) { car.x = b.x1; car.vx = -Math.abs(car.vx) * 0.3; }
  if (car.y < b.y0) { car.y = b.y0; car.vy = Math.abs(car.vy) * 0.3; }
  if (car.y > b.y1) { car.y = b.y1; car.vy = -Math.abs(car.vy) * 0.3; }
  // jumps: ride up the ramp, take off at the lip
  if (car.z <= 0) {
    let inR = null, h = 0;
    for (const r of tr.ramps) {
      const dx = car.x - r.x, dy = car.y - r.y, c = Math.cos(r.a), s = Math.sin(r.a);
      const al = dx * c + dy * s, la = -dx * s + dy * c;
      if (al > -r.len / 2 && al < r.len / 2 && Math.abs(la) < tr.width / 2) { inR = r; h = r.h * (al + r.len / 2) / r.len; }
    }
    if (car.rampIn && !inR) {
      const r = car.rampIn, al = (car.x - r.x) * Math.cos(r.a) + (car.y - r.y) * Math.sin(r.a);
      const along = car.vx * Math.cos(r.a) + car.vy * Math.sin(r.a);
      if (al >= r.len / 2 - 3 && along > 120) { car.z = r.h; car.vz = along * 0.5; }
    }
    car.rampIn = inR; car.rampH = inR ? Math.max(0, h) : 0;
  } else { car.rampIn = null; car.rampH = 0; }
  // skid marks
  const sp = Math.abs(fwd);
  if (car.z <= 0 && Math.abs(lat) > 85 && sp > 60 && race.skids) {
    const bx = car.x - fx * 11, by = car.y - fy * 11;
    race.skids.push([bx - fy * 7, by + fx * 7, car.a], [bx + fy * 7, by - fx * 7, car.a]);
    if (race.skids.length > 1600) race.skids.splice(0, 200);
  }
  // track position + laps
  const N = tr.N, prev = car.idx;
  const r = nearest(tr, car.x, car.y, prev, 45);
  car.idx = r.i; car.off = r.d > tr.width / 2 + 3;
  if (prev > N * 0.75 && r.i < N * 0.25) car.laps++;
  else if (prev < N * 0.25 && r.i > N * 0.75) car.laps--;
  if (car.laps > car.maxLap) {
    car.maxLap = car.laps;
    if (car.laps >= 1) {
      car.lapTimes.push(race.t - car.lapStart);
      car.lapStart = race.t;
      if (car.laps >= race.laps && car.finishTime == null) { car.finishTime = race.t; race.finishOrder.push(car); }
    }
  }
}

function collide(race) {
  const cars = race.cars;
  for (let i = 0; i < cars.length; i++) for (let j = i + 1; j < cars.length; j++) {
    const A = cars[i], B = cars[j];
    if (Math.abs(A.z - B.z) > 10) continue;
    const dx = A.x - B.x, dy = A.y - B.y, d = Math.hypot(dx, dy), R = A.r + B.r;
    if (d >= R || d < 0.001) continue;
    const nx = dx / d, ny = dy / d, ma = A.spec.mass, mb = B.spec.mass, ov = R - d;
    A.x += nx * ov * mb / (ma + mb); A.y += ny * ov * mb / (ma + mb);
    B.x -= nx * ov * ma / (ma + mb); B.y -= ny * ov * ma / (ma + mb);
    const rv = (A.vx - B.vx) * nx + (A.vy - B.vy) * ny;
    if (rv < 0) {
      const jj = -(1 + 0.35) * rv / (1 / ma + 1 / mb);
      A.vx += nx * jj / ma; A.vy += ny * jj / ma; B.vx -= nx * jj / mb; B.vy -= ny * jj / mb;
      hurt(race, A, (jj / ma - 50) * 0.035); hurt(race, B, (jj / mb - 50) * 0.035);
      if (jj > 90 && race.events) race.events.push({ bump: true, x: (A.x + B.x) / 2, y: (A.y + B.y) / 2, p: A.isPlayer || B.isPlayer });
    }
  }
}

function collideSolids(race, car) {
  if (car.z > 14) return;
  for (const s of race.solids) {
    const R = car.r + s[2], dx = car.x - s[0], dy = car.y - s[1];
    if (dx > R || dx < -R || dy > R || dy < -R) continue;
    const d = Math.hypot(dx, dy);
    if (d >= R || d < 0.001) continue;
    const nx = dx / d, ny = dy / d;
    car.x += nx * (R - d); car.y += ny * (R - d);
    const vn = car.vx * nx + car.vy * ny;
    if (vn < 0) {
      car.vx -= 1.4 * vn * nx; car.vy -= 1.4 * vn * ny;
      hurt(race, car, (-vn - 50) * 0.06);
      if (-vn > 120 && race.events) race.events.push({ bump: true, x: car.x - nx * car.r, y: car.y - ny * car.r, p: car.isPlayer });
    }
  }
}

function pickups(race, dt) {
  for (const p of race.pickups) {
    if (p.t > 0) { p.t -= dt; continue; }
    for (const c of race.cars) {
      if (c.z > 12 || c.finishTime != null) continue;
      const dx = c.x - p.x, dy = c.y - p.y;
      if (dx * dx + dy * dy > (c.r + 13) ** 2) continue;
      let text = '';
      if (p.type === 'cash') { c.cash += race.cashValue; text = '+$' + race.cashValue; }
      else if (p.type === 'nitro') { c.nitro = Math.min(3, c.nitro + 1); text = 'Nitro!'; }
      else { c.dmg = Math.max(0, c.dmg - 30); text = 'Repair'; }
      p.t = 9;
      race.events.push({ x: p.x, y: p.y, text, type: p.type, p: c.isPlayer });
      break;
    }
  }
}

function stepRace(race, dt, playerCtl) {
  if (race.state === 'countdown') {
    race.cd -= dt;
    if (race.cd <= 0) race.state = 'racing';
    return;
  }
  race.t += dt;
  for (const car of race.cars) {
    const human = car.isPlayer && !race.autoPlayer && car.finishTime == null;
    const ctl = human ? playerCtl : aiControl(race, car, dt);
    const sp = Math.hypot(car.vx, car.vy);
    if (!human) {
      if (sp < 22 && car.z <= 0) car.stuckT += dt; else car.stuckT = 0;
      if (car.stuckT > 1.2) { car.revT = 0.9; car.stuckT = 0; }
      if (car.revT > 0) car.revT -= dt;
    }
    physics(race, car, ctl, dt);
  }
  collide(race);
  if (race.solids.length) for (const car of race.cars) collideSolids(race, car);
  pickups(race, dt);
  const me = race.cars.find(c => c.isPlayer);
  if (race.state === 'racing' && me.finishTime != null) race.state = 'done';
}

function standings(race) {
  return race.cars.slice().sort((a, b) => {
    if (a.finishTime != null && b.finishTime != null) return a.finishTime - b.finishTime;
    if (a.finishTime != null) return -1;
    if (b.finishTime != null) return 1;
    return progress(race, b) - progress(race, a);
  });
}

  }

  $('screen').addEventListener('click', e => {
    const el = e.target.closest('[data-act]');

    const act = el.dataset.act, v = Number(el.dataset.v);
    const list = trackList();
    switch (act) {
      case 'menu': showMenu(); break;
      case 'quick': showQuick(); break;
      case 'career': showCareer(); break;
      case 'editor': openEditor(); break;
      case 'garage': showGarage(); break;
      case 'track': settings.track = (settings.track + v + list.length) % list.length; saveSettings(); showQuick(); break;
      case 'car': settings.car = (settings.car + v + CARS.length) % CARS.length; saveSettings(); showQuick(); break;
      case 'style': settings.style = v; saveSettings(); showQuick(); break;
      case 'laps': settings.laps = v; saveSettings(); showQuick(); break;
      case 'color': settings.color = v; saveSettings(); showQuick(); break;

        showCareer(); break;

        const d = career.dmg[career.car] || 0, rate = repairRate(career.car), fix = Math.min(d, Math.floor(career.money / rate));

        showGarage(); break;

      case 'buy':

        }
        showGarage(); break;
      case 'sell':
        if (v !== career.car && career.owned.includes(v)) {

        }

  // ---------- results ----------
  function onFinish() {
    const st = standings(race), me = race.cars.find(c => c.isPlayer);
    race.final = st;
    const myBest = me.lapTimes.length ? Math.min(...me.lapTimes) : null;
    const key = 'best-' + raceCtx.entry.key, rec = store.get(key, null);
    if (myBest != null && (rec == null || myBest < rec)) { store.set(key, myBest); race.note = 'New lap record on ' + race.track.name + ': ' + fmt(myBest); }
    else race.note = rec != null ? 'Lap record on ' + race.track.name + ': ' + fmt(rec) : '';

  }
  function fillResults() {
    const isCareer = raceCtx.kind === 'career';
    const st = isCareer ? race.final : standings(race), me = race.cars.find(c => c.isPlayer);
    const place = st.indexOf(me) + 1;
    let rows = '';
    st.forEach((c, i) => {
      const best = c.lapTimes.length ? Math.min(...c.lapTimes) : null;
      rows += `<tr class="${c.isPlayer ? 'me' : ''}"><td>${i + 1}</td><td><span class="dot" style="background:${c.color}"></span>${esc(c.name)}<br><small>${c.spec.name}</small></td>
        <td>${c.finishTime != null ? fmt(c.finishTime) : (isCareer ? '—' : 'racing…')}</td><td>${fmt(best)}</td>${isCareer ? '<td>+' + POINTS[i] + '</td>' : ''}</tr>`;
    });
    let extra = '';
    if (isCareer && race.reward) {
      const r = race.reward;

    } else if (me.cash) extra = `<p class="sub" style="margin-top:8px">You picked up ${money(me.cash)} (career mode lets you spend it).</p>`;
    const btns = isCareer ? '<button class="go" data-act="career">Continue</button>'
      : '<button class="go" data-act="again">Race again</button>' +
        (raceCtx.kind === 'editor' ? '<button class="go alt" data-act="edit">Back to editor</button>' : '<button class="go alt" data-act="quick">Change race</button>') +
        '<button class="go alt" data-act="menu">Main menu</button>';

      <table><thead><tr><th>#</th><th>Driver</th><th>Time</th><th>Best lap</th>${isCareer ? '<th>Pts</th>' : ''}</tr></thead><tbody>${rows}</tbody></table>
      ${extra}<p class="sub" style="margin-top:8px">${esc(race.note || '')}</p>${btns}`;
  }

  // ---------- 2D fallback drawing (top-down) ----------
  const ISO = VSIN, HS = VCOS;
  let zoom = 1;
  function P(x, y, h) { return [W / 2 + (x - cam.x) * zoom, H / 2 + ((y - cam.y) * ISO - h * HS) * zoom]; }
  const depth = (x, y) => y - cam.y;
  function poly(g, pts) {
    g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]);
    g.closePath(); g.fill();
  }
  function box(g, part) {
    const c = part.c, B = c.map(p => P(p[0], p[1], part.z0)), T = c.map(p => P(p[0], p[1], part.z1));
    const mx = (c[0][0] + c[1][0] + c[2][0] + c[3][0]) / 4, my = (c[0][1] + c[1][1] + c[2][1] + c[3][1]) / 4;
    for (let i = 0; i < 4; i++) {
      const j = (i + 1) % 4;
      let nx = c[j][1] - c[i][1], ny = -(c[j][0] - c[i][0]);
      const fx2 = (c[i][0] + c[j][0]) / 2 - mx, fy2 = (c[i][1] + c[j][1]) / 2 - my;
      if (nx * fx2 + ny * fy2 < 0) { nx = -nx; ny = -ny; }
      const len = Math.hypot(nx, ny) || 1; nx /= len; ny /= len;
      if (ny <= 0) continue;
      const light = (-nx * 0.6 + ny * 0.4 + 1) / 2;
      g.fillStyle = part.side || shade(part.col, -0.42 + light * 0.36);
      poly(g, [B[i], B[j], T[j], T[i]]);

    poly(g, T);
  }
  function drawParts(g, o) {
    const parts = o.parts.slice().sort((a, b) => depth(0, (a.c[0][1] + a.c[2][1]) / 2) - depth(0, (b.c[0][1] + b.c[2][1]) / 2));
    for (const p of parts) box(g, p);
    if (o.dots) for (const d of o.dots) {
      const s = P(d[0], d[1], d[2] + 2);
      g.fillStyle = d[3]; g.fillRect(s[0] - 1.6 * zoom, s[1] - 2.6 * zoom, 3.2 * zoom, 3.2 * zoom);

  }
  function disc(g, x, y, h, r, col) { const c = P(x, y, h); g.fillStyle = col; g.beginPath(); g.ellipse(c[0], c[1], r * zoom, r * zoom * ISO, 0, 0, 7); g.fill(); }
  function drawFlora(g, o) {
    const k = o.kind;
    if (o.barrier) {
      const col = o.barrier === 'tyres' ? '#1c1c1c' : o.col;
      for (let s = 0; s < 3; s++) disc(g, o.x, o.y, s * 3, 8, s === 2 ? o.col : shade(col.startsWith('#') ? col : '#888888', -0.25));
      return;
    }
    disc(g, o.x + o.r * 0.5, o.y + o.r * 0.4, 0, o.r * 0.9, 'rgba(0,0,0,.22)');
    if (k === 'rock') { disc(g, o.x, o.y, 0, o.r, '#7d6a55'); disc(g, o.x - o.r * 0.15, o.y - o.r * 0.15, o.h * 0.6, o.r * 0.7, '#a08868'); return; }
    if (k === 'pillar') { for (let s = 0; s < 4; s++) disc(g, o.x, o.y, o.h * s / 3, o.r * (1 - s * 0.07), s % 2 ? '#a9542b' : '#c46a38'); return; }
    if (k === 'cactus') { for (let s = 0; s < 5; s++) disc(g, o.x, o.y, o.h * s / 4, 4.5, s === 4 ? '#5fae5a' : '#3f8f45'); return; }
    if (k === 'bush') { disc(g, o.x, o.y, o.r * 0.5, o.r, '#3c7a2a'); return; }

    g.fillStyle = '#5d4037'; g.fillRect(s[0] - 2.5 * zoom, top[1], 5 * zoom, s[1] - top[1]);
    if (k === 'pine' || k === 'snowpine') {
      for (const [k0, k1] of [[0.25, 1], [0.5, 0.75], [0.72, 0.5]]) disc(g, o.x, o.y, o.h * k0 + 6, o.r * k1, k === 'snowpine' && k1 < 0.6 ? '#eef4f7' : shade('#2f6b35', k1 - 0.9));
    } else if (k === 'deadtree') {
      disc(g, o.x, o.y, o.h, 6, '#4a5a2a');
    } else {
      const base = k === 'willow' ? '#5f7a2c' : (o.tone < 0.5 ? '#3a7d2c' : '#4a8a2a');
      for (const [k0, k1, f] of [[0.55, 1, -0.2], [0.75, 0.8, 0], [0.92, 0.5, 0.15]]) disc(g, o.x, o.y, o.h * k0, o.r * k1, shade(base, f));
    }
  }
  function drawCar(g, car) {
    const ca = Math.cos(car.a), sa = Math.sin(car.a), lift = car.z + car.rampH;
    const L = (lx, ly) => [car.x + lx * ca - ly * sa, car.y + lx * sa + ly * ca];
    const R = (x0, x1, y0, y1) => [L(x0, y0), L(x1, y0), L(x1, y1), L(x0, y1)];
    const len = car.r + 3, wid = car.r * 0.62;
    g.fillStyle = 'rgba(0,0,0,.3)';
    poly(g, R(-len, len, -wid - 2, wid + 2).map(p => P(p[0] + 4 + lift * 0.4, p[1] + 3 + lift * 0.3, 0)));
    const parts = [
      ...[[-len + 4, -wid - 2.5], [len - 12, -wid - 2.5], [-len + 4, wid - 0.5], [len - 12, wid - 0.5]].map(([x0, y0]) =>
        ({ c: R(x0, x0 + 8, y0, y0 + 3), z0: lift, z1: lift + 7, col: '#1a1a1a', top: '#2b2b2b' })),
      { c: R(-len, len, -wid, wid), z0: lift + 3, z1: lift + 10, col: car.color },
      { c: R(-len * 0.55, len * 0.3, -wid * 0.83, wid * 0.83), z0: lift + 10, z1: lift + 16, col: '#2a4057', top: shade(car.color, 0.15) },
    ];
    parts.sort((a, b) => depth(0, (a.c[0][1] + a.c[2][1]) / 2) - depth(0, (b.c[0][1] + b.c[2][1]) / 2) + (a.z0 - b.z0) * 0.01);
    for (const p of parts) box(g, p);

  function drawWorld2D(g) {
    g.fillStyle = THEMES[race.track.theme].outer; g.fillRect(0, 0, W, H);
    g.save();
    g.translate(W / 2, H / 2); g.scale(zoom, zoom * ISO); g.translate(-cam.x, -cam.y);
    const b = race.track.bounds;
    g.drawImage(trackImg, b.x0, b.y0, b.x1 - b.x0, b.y1 - b.y0);
    g.fillStyle = 'rgba(25,25,25,.25)';
    for (const s of race.skids) g.fillRect(s[0] - 2, s[1] - 2, 4, 4);
    for (const r of race.track.ramps) {
      g.save(); g.translate(r.x, r.y); g.rotate(r.a);
      for (let k = 0; k < 8; k++) { g.fillStyle = k % 2 ? '#ffca28' : '#333'; g.fillRect(-r.len / 2, -race.track.width / 2 + race.track.width * k / 8, r.len, race.track.width / 8); }
      g.restore();
    }
    g.restore();

    const vis = (x, y, pad) => { const s = P(x, y, 0); return s[0] > -pad && s[0] < W + pad && s[1] > -pad * 0.6 && s[1] < H + pad * 1.6; };
    for (const o of scenery) if (vis(o.x, o.y, o.big ? 400 : 120)) items.push({ d: depth(o.x, o.y), o });
    for (const c of race.cars) if (vis(c.x, c.y, 80)) items.push({ d: depth(c.x, c.y), car: c });
    items.sort((a, b2) => a.d - b2.d);
    for (const it of items) {
      if (it.car) drawCar(g, it.car);
      else if (it.o.parts) drawParts(g, it.o);
      else drawFlora(g, it.o);
    }
    if (beam) drawParts(g, beam);
  }

  // ---------- overlay: pickups, effects, minimap, text ----------
  const PICK = { cash: ['#2e7d32', '$'], nitro: ['#1565c0', 'N'], wrench: ['#ef6c00', '+'] };
  function drawPickups(g) {
    const t = performance.now() / 1000;
    for (const p of race.pickups) {
      if (p.t > 0) continue;
      const h = 9 + Math.sin(t * 3 + p.x * 0.01) * 2.5, s = P(p.x, p.y, h), sh = P(p.x + 3, p.y + 3, 0);
      if (s[0] < -30 || s[0] > W + 30 || s[1] < -30 || s[1] > H + 30) continue;
      const r = 10 * zoom, [col, ch] = PICK[p.type];
      g.fillStyle = 'rgba(0,0,0,.25)'; g.beginPath(); g.ellipse(sh[0], sh[1], r, r * 0.6, 0, 0, 7); g.fill();
      g.fillStyle = col; g.strokeStyle = '#fff'; g.lineWidth = 2;
      g.beginPath(); g.arc(s[0], s[1], r, 0, 7); g.fill(); g.stroke();
      g.fillStyle = '#fff'; g.font = '900 ' + Math.round(r * 1.25) + 'px system-ui, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(ch, s[0], s[1] + 1);
    }
  }
  function updateFx(dt) {
    for (const e of race.events) {
      if (e.bump) {
        for (let k = 0; k < 6; k++) fx.push({ k: 'spark', x: e.x, y: e.y, h: 6, vx: (Math.random() - 0.5) * 160, vy: (Math.random() - 0.5) * 160, vh: 60 + Math.random() * 60, t: 0.4, T: 0.4 });
        if (e.p && mode === 'race') shake = Math.min(1, shake + 0.35);
      } else if (e.p) fx.push({ k: 'text', x: e.x, y: e.y, h: 20, text: e.text, col: PICK[e.type][0], t: 1.2, T: 1.2 });
    }
    race.events.length = 0;
    for (const c of race.cars) {
      if (c.dmg > 55 && Math.random() < dt * (c.dmg - 45) / 6)
        fx.push({ k: 'smoke', x: c.x - Math.cos(c.a) * 8, y: c.y - Math.sin(c.a) * 8, h: 12 + c.z, vx: 0, vy: 0, vh: 30, t: 1.1, T: 1.1, dark: c.dmg >= 100 });
    }
    for (const f of fx) {
      f.t -= dt;
      if (f.k === 'spark') { f.x += f.vx * dt; f.y += f.vy * dt; f.h += f.vh * dt; f.vh -= 400 * dt; }
      else if (f.k === 'smoke') f.h += f.vh * dt;
      else f.h += 25 * dt;
    }
    fx = fx.filter(f => f.t > 0);
    if (fx.length > 400) fx.splice(0, fx.length - 400);
    shake = Math.max(0, shake - dt * 2.5);
  }
  function drawFx(g) {
    for (const c of race.cars) if (c.boostT > 0) {
      const t = performance.now() / 60;
      for (let k = 0; k < 3; k++) {
        const back = c.r + 4 + k * 5 + Math.sin(t + k) * 2, s = P(c.x - Math.cos(c.a) * back, c.y - Math.sin(c.a) * back, 6 + c.z + c.rampH);
        g.fillStyle = ['rgba(255,240,120,.95)', 'rgba(255,150,40,.8)', 'rgba(255,70,20,.5)'][k];
        g.beginPath(); g.arc(s[0], s[1], (5 - k) * zoom, 0, 7); g.fill();
      }
    }
    for (const f of fx) {
      const s = P(f.x, f.y, f.h), a = f.t / f.T;
      if (f.k === 'spark') { g.fillStyle = 'rgba(255,230,120,' + a + ')'; g.fillRect(s[0] - 1.5, s[1] - 1.5, 3, 3); }
      else if (f.k === 'smoke') {
        g.fillStyle = f.dark ? 'rgba(30,30,30,' + a * 0.55 + ')' : 'rgba(200,200,200,' + a * 0.5 + ')';
        g.beginPath(); g.arc(s[0], s[1], (4 + (1 - a) * 10) * zoom, 0, 7); g.fill();
      } else {
        g.save(); g.globalAlpha = Math.min(1, a * 2); g.font = '900 18px system-ui, sans-serif'; g.textAlign = 'center';
        g.lineWidth = 4; g.strokeStyle = 'rgba(0,0,0,.6)'; g.strokeText(f.text, s[0], s[1]);
        g.fillStyle = '#fff'; g.fillText(f.text, s[0], s[1]); g.restore();
      }
    }
  }
  function drawMinimap(g, x, y, size) {
    const tr = race.track;
    if (!tr.mini) {
      let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
      for (const p of tr.pts) { x0 = Math.min(x0, p[0]); x1 = Math.max(x1, p[0]); y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1]); }
      tr.mini = { x0, y0, x1, y1 };
    }
    const m = tr.mini, s = size / (m.x1 - m.x0), hgt = (m.y1 - m.y0) * s;
    const map = p => [(p[0] - m.x0) * s, (p[1] - m.y0) * s];

    g.fillStyle = 'rgba(0,0,0,.4)';

  function draw() {

    zoom = clamp(Math.sqrt(W * H) / 800, 0.7, 1.35);
    const lx = me.x + me.vx * 0.45, ly = me.y + me.vy * 0.45;
    cam.x += (lx - cam.x) * 0.08; cam.y += (ly - cam.y) * 0.08;
    const save = { x: cam.x, y: cam.y };
    if (shake > 0) { cam.x += (Math.random() - 0.5) * shake * 10; cam.y += (Math.random() - 0.5) * shake * 10; }
    if (GLR) {
      GLR.render(race, cam, zoom, W, H, DPR, mode === 'race');
      g.clearRect(0, 0, W, H);

  function drawOverlay(g, me) {

      const n = Math.ceil(race.cd - 0.2);

      else if (me.dmg >= 100) smallText('Wrecked! Limp to the finish');

    if (race.state === 'done' && !resultsShown) bigText('FINISH', '#ffcc33');
  }
  function bigText(t, col) {
    const g = ctx; g.save(); g.font = '900 ' + Math.round(Math.min(W, H) * 0.2) + 'px system-ui, sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineWidth = 8; g.strokeStyle = 'rgba(0,0,0,.6)';
    g.strokeText(t, W / 2, H * 0.4); g.fillStyle = col; g.fillText(t, W / 2, H * 0.4); g.restore();
  }
  function smallText(t) {
    const g = ctx; g.save(); g.font = '800 22px system-ui, sans-serif'; g.textAlign = 'center';
    g.lineWidth = 5; g.strokeStyle = 'rgba(0,0,0,.6)'; g.strokeText(t, W / 2, H * 0.24);
    g.fillStyle = '#fff'; g.fillText(t, W / 2, H * 0.24); g.restore();
  }
  function updateHud() {
    const me = race.cars.find(c => c.isPlayer), st = standings(race);
    const lap = clamp(me.laps + 1, 1, race.laps);
    const cur = race.state === 'countdown' ? 0 : race.t - me.lapStart;
    const best = me.lapTimes.length ? Math.min(...me.lapTimes) : null;
    const kmh = Math.round(Math.hypot(me.vx, me.vy) * 0.5), d = Math.round(me.dmg);
    hud.innerHTML = '<div class="big">' + ord(st.indexOf(me) + 1) + ' <span>/ ' + st.length + '</span></div>' +
      '<div>Lap ' + lap + ' / ' + race.laps + '</div>' +
      '<div class="small">Time ' + fmt(race.t) + ' · Lap ' + fmt(cur) + '</div>' +
      '<div class="small">Best ' + fmt(best) + ' · ' + kmh + ' km/h</div>' +
      '<div class="dmg"><span>Damage</span>' + bar(d / 100, dmgCol(d)) + '<span>' + d + '%</span></div>' +
      '<div class="small">Nitro ' + '⚡'.repeat(me.nitro) + '<span style="opacity:.35">' + '⚡'.repeat(3 - me.nitro) + '</span>' +
      (me.cash ? ' · <span class="money">+' + money(me.cash) + '</span>' : '') + '</div>';
  }

  // ---------- track editor ----------
  const ED = { W: 2500, H: 1900 };
  const ed = { pts: [], theme: 'meadow', width: 150, name: '', idx: -1, sel: -1, drag: -1, moved: false, undo: [], tr: null, bad: [], delArm: 0, msg: '' };
  const edCv = $('edCanvas'), eg = edCv.getContext('2d');
  let edView = { s: 1, ox: 0, oy: 0, w: 0, h: 0 };
  function edResize() {
    const r = edCv.getBoundingClientRect();
    edCv.width = Math.max(1, r.width * DPR); edCv.height = Math.max(1, r.height * DPR);
    const s = Math.min((r.width - 24) / ED.W, (r.height - 24) / ED.H);
    edView = { s, ox: (r.width - ED.W * s) / 2, oy: (r.height - ED.H * s) / 2, w: r.width, h: r.height };
  }
  const toS = p => [edView.ox + p[0] * edView.s, edView.oy + p[1] * edView.s];
  const toW = (x, y) => [Math.round(clamp((x - edView.ox) / edView.s, 150, ED.W - 150)), Math.round(clamp((y - edView.oy) / edView.s, 150, ED.H - 150))];
  function edRebuild() {
    ed.tr = ed.pts.length >= 4 ? buildTrack({ name: ed.name || 'Custom', theme: ed.theme, width: ed.width, points: ed.pts }) : null;
    ed.bad = ed.tr ? trackOverlaps(ed.tr) : [];
    edStatus(); edDraw();
  }
  const edValid = () => !!ed.tr && !ed.bad.length && ed.tr.N >= 220;
  function edStatus(msg) {
    if (msg) ed.msg = msg;
    let t;
    if (ed.pts.length < 4) t = 'Tap to place corner points (' + ed.pts.length + ' of at least 4). Point 1 is the start line; the race runs in number order.';
    else if (ed.bad.length) t = '⚠ The road runs into itself where it’s red. Drag points further apart.';
    else if (ed.tr.N < 220) t = 'Too short. Spread the points out over the map.';
    else t = (ed.msg ? ed.msg + ' · ' : '') + 'Ready to race. Drag points to move them; tap one to select it.';
    $('edStatus').textContent = t;
    ed.msg = '';
  }
  function edDraw() {
    const g = eg, th = THEMES[ed.theme], s = edView.s;
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    g.fillStyle = '#16201a'; g.fillRect(0, 0, edView.w, edView.h);
    const a = toS([0, 0]);
    g.fillStyle = th.ground; g.fillRect(a[0], a[1], ED.W * s, ED.H * s);
    g.strokeStyle = 'rgba(0,0,0,.1)'; g.lineWidth = 1;
    for (let x = 250; x < ED.W; x += 250) { const p = toS([x, 0]); g.beginPath(); g.moveTo(p[0], a[1]); g.lineTo(p[0], a[1] + ED.H * s); g.stroke(); }
    for (let y = 250; y < ED.H; y += 250) { const p = toS([0, y]); g.beginPath(); g.moveTo(a[0], p[1]); g.lineTo(a[0] + ED.W * s, p[1]); g.stroke(); }
    if (ed.tr) {
      const tr = ed.tr, path = new Path2D();
      tr.pts.forEach((p, i) => { const q = toS(p); i ? path.lineTo(q[0], q[1]) : path.moveTo(q[0], q[1]); });
      path.closePath();
      g.lineJoin = 'round';
      g.strokeStyle = th.verge; g.lineWidth = (tr.width + 60) * s; g.stroke(path);
      g.strokeStyle = th.road; g.lineWidth = tr.width * s; g.stroke(path);
      for (const p of tr.patches) { const q = toS([p.x, p.y]); g.fillStyle = PATCHES[p.kind].col; g.beginPath(); g.arc(q[0], q[1], p.r * s, 0, 7); g.fill(); }
      for (const r of tr.ramps) {
        const q = toS([r.x, r.y]); g.save(); g.translate(q[0], q[1]); g.rotate(r.a);
        g.fillStyle = '#ffca28'; g.fillRect(-r.len * s / 2, -tr.width * s / 2, r.len * s, tr.width * s); g.restore();
      }
      g.fillStyle = 'rgba(255,255,255,.7)';
      for (let k = 0; k < 10; k++) {
        const i = Math.floor((k + 0.5) * tr.N / 10), q = toS(tr.pts[i]), an = tr.ang[i], l = 7;
        g.beginPath(); g.moveTo(q[0] + Math.cos(an) * l, q[1] + Math.sin(an) * l);
        g.lineTo(q[0] + Math.cos(an + 2.5) * l, q[1] + Math.sin(an + 2.5) * l); g.lineTo(q[0] + Math.cos(an - 2.5) * l, q[1] + Math.sin(an - 2.5) * l); g.fill();
      }
      const q0 = toS(tr.pts[0]), a0 = tr.ang[0], hw = tr.width * s / 2;
      g.strokeStyle = '#fff'; g.lineWidth = 4;
      g.beginPath(); g.moveTo(q0[0] + Math.sin(a0) * hw, q0[1] - Math.cos(a0) * hw); g.lineTo(q0[0] - Math.sin(a0) * hw, q0[1] + Math.cos(a0) * hw); g.stroke();
      g.fillStyle = 'rgba(255,40,40,.55)';
      for (const i of ed.bad) { const q = toS(tr.pts[i]); g.beginPath(); g.arc(q[0], q[1], Math.max(10, tr.width * s * 0.7), 0, 7); g.fill(); }
    } else if (ed.pts.length > 1) {
      g.strokeStyle = 'rgba(255,255,255,.6)'; g.lineWidth = 2; g.setLineDash([6, 6]);
      g.beginPath(); ed.pts.forEach((p, i) => { const q = toS(p); i ? g.lineTo(q[0], q[1]) : g.moveTo(q[0], q[1]); }); g.stroke(); g.setLineDash([]);
    }
    g.textAlign = 'center'; g.textBaseline = 'middle'; g.font = '800 11px system-ui, sans-serif';
    ed.pts.forEach((p, i) => {
      const q = toS(p);
      g.fillStyle = i === ed.sel ? '#ffcc33' : i === 0 ? '#ffffff' : '#1f2a22';
      g.strokeStyle = i === ed.sel ? '#1a1a1a' : '#fff'; g.lineWidth = 2;
      g.beginPath(); g.arc(q[0], q[1], 11, 0, 7); g.fill(); g.stroke();
      g.fillStyle = i === ed.sel || i === 0 ? '#1a1a1a' : '#fff'; g.fillText(String(i + 1), q[0], q[1] + 0.5);
    });
  }
  function edPush() { ed.undo.push(JSON.stringify(ed.pts)); if (ed.undo.length > 60) ed.undo.shift(); }
  function edPos(e) { const r = edCv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
  edCv.addEventListener('pointerdown', e => {
    e.preventDefault();
    const [x, y] = edPos(e);
    let hit = -1, hd = 24;
    ed.pts.forEach((p, i) => { const q = toS(p), d = Math.hypot(q[0] - x, q[1] - y); if (d < hd) { hd = d; hit = i; } });
    edPush();
    if (hit >= 0) { ed.drag = hit; ed.sel = hit; ed.moved = false; }
    else {
      const p = toW(x, y);
      if (ed.pts.length < 3) { ed.pts.push(p); ed.sel = ed.pts.length - 1; }
      else {
        let bi = 0, bc = 1e18;
        for (let i = 0; i < ed.pts.length; i++) {
          const a = ed.pts[i], b = ed.pts[(i + 1) % ed.pts.length];
          const c = Math.hypot(a[0] - p[0], a[1] - p[1]) + Math.hypot(b[0] - p[0], b[1] - p[1]) - Math.hypot(a[0] - b[0], a[1] - b[1]);
          if (c < bc) { bc = c; bi = i; }
        }
        ed.pts.splice(bi + 1, 0, p); ed.sel = bi + 1;
      }
      ed.drag = ed.sel; ed.moved = true;
    }
    try { edCv.setPointerCapture(e.pointerId); } catch (x2) {}
    edRebuild();
  });
  edCv.addEventListener('pointermove', e => {
    if (ed.drag < 0) return;
    const [x, y] = edPos(e), p = toW(x, y), o = ed.pts[ed.drag];
    if (o[0] === p[0] && o[1] === p[1]) return;
    ed.pts[ed.drag] = p; ed.moved = true; edRebuild();
  });
  const edUp = () => { if (ed.drag >= 0 && !ed.moved) ed.undo.pop(); ed.drag = -1; };
  edCv.addEventListener('pointerup', edUp); edCv.addEventListener('pointercancel', edUp);

  function edFillSelects() {
    $('edTrack').innerHTML = '<option value="new">New track</option>' +
      customs.map((c, i) => `<option value="c${i}">${esc(c.name)}</option>`).join('') +
      LAYOUTS.map((l, i) => `<option value="l${i}">Copy of ${esc(l.name)}</option>`).join('');
    $('edTrack').value = ed.idx >= 0 ? 'c' + ed.idx : 'new';
    $('edTheme').innerHTML = Object.keys(THEMES).map(k => `<option value="${k}">${THEMES[k].name}</option>`).join('');
    $('edTheme').value = ed.theme; $('edWidth').value = String(ed.width); $('edName').value = ed.name;
  }
  function edLoad(v) {
    ed.undo = []; ed.sel = -1;
    if (v[0] === 'c') {
      const c = customs[+v.slice(1)]; ed.idx = +v.slice(1);
      ed.pts = c.points.map(p => p.slice()); ed.theme = c.theme; ed.width = c.width; ed.name = c.name;
    } else if (v[0] === 'l') {
      const l = LAYOUTS[+v.slice(1)]; ed.idx = -1;
      ed.pts = l.points.map(p => [p[0] + 100, p[1] + 50]); ed.theme = l.theme; ed.width = l.width; ed.name = 'My ' + l.name;
    } else { ed.idx = -1; ed.pts = []; ed.name = 'My track ' + (customs.length + 1); }
    edFillSelects(); edRebuild();
  }
  function edSave() {
    if (!edValid()) { edStatus(); return false; }
    const rec = { name: (ed.name || '').trim() || 'My track', theme: ed.theme, width: ed.width, points: ed.pts.map(p => p.slice()) };
    if (ed.idx >= 0 && customs[ed.idx]) customs[ed.idx] = rec;
    else { customs.push(rec); ed.idx = customs.length - 1; }
    store.set('custom', customs);
    ed.name = rec.name;
    edFillSelects(); edStatus('Saved');
    return true;
  }
  function openEditor() {
    leaveRace();
    mode = 'editor'; show('screen', false);
    $('editor').classList.add('show');
    if (!ed.pts.length && ed.idx < 0 && !ed.name) ed.name = 'My track ' + (customs.length + 1);
    edFillSelects();
    requestAnimationFrame(() => { edResize(); edRebuild(); });
  }
  $('edTrack').onchange = e => edLoad(e.target.value);
  $('edName').oninput = e => { ed.name = e.target.value; };
  $('edTheme').onchange = e => { ed.theme = e.target.value; edRebuild(); };
  $('edWidth').onchange = e => { ed.width = +e.target.value; edRebuild(); };
  $('edUndo').onclick = () => { if (ed.undo.length) { ed.pts = JSON.parse(ed.undo.pop()); ed.sel = -1; edRebuild(); } };
  $('edDel').onclick = () => { if (ed.sel >= 0 && ed.sel < ed.pts.length) { edPush(); ed.pts.splice(ed.sel, 1); ed.sel = -1; edRebuild(); } };
  $('edClear').onclick = () => { if (ed.pts.length) { edPush(); ed.pts = []; ed.sel = -1; edRebuild(); } };
  $('edSave').onclick = edSave;
  $('edDrive').onclick = () => {
    if (!edSave()) return;
    settings.track = TRACKS.length + ed.idx; saveSettings();
    $('editor').classList.remove('show');
    startRace('editor');
  };
  $('edRemove').onclick = () => {
    if (ed.idx < 0) { edLoad('new'); return; }
    if (ed.delArm > Date.now()) {
      customs.splice(ed.idx, 1); store.set('custom', customs); ed.delArm = 0;
      $('edRemove').textContent = 'Delete track'; edLoad('new'); edStatus('Track deleted');
    } else { ed.delArm = Date.now() + 3000; $('edRemove').textContent = 'Tap again to delete'; setTimeout(() => { $('edRemove').textContent = 'Delete track'; }, 3000); }
  };
  $('edClose').onclick = () => { $('editor').classList.remove('show'); showMenu(); };
  // ---------- loop ----------
  let last = performance.now(), accT = 0, hudT = 0;
  const STEP = 1 / 120;
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (mode === 'editor') { requestAnimationFrame(frame); return; }
    if (race && !paused) {
      accT += dt;
      const inp = mode === 'race' ? playerInput() : {};
      let n = 0;
      while (accT >= STEP && n < 12) { stepRace(race, STEP, inp); accT -= STEP; n++; }
      if (n === 12) accT = 0;
      if (GLR && race.skids.length) { GLR.addSkids(race.skids); race.skids.length = 0; }
      updateFx(dt);
      if (mode === 'race') {
        hudT -= dt;
        if (hudT <= 0) { updateHud(); hudT = 0.1; }
        if (race.state === 'done') {
          resTimer += dt;
          if (!resultsShown && resTimer > 1.6) {
            resultsShown = true; onFinish(); fillResults(); show('results', true); $('touch').style.display = 'none';
          } else if (resultsShown && raceCtx.kind !== 'career' && Math.floor(resTimer * 2) !== Math.floor((resTimer - dt) * 2)) fillResults();
        }
      } else if (race.t > 240) startDemo(curKey ? trackList().find(t => t.key === curKey) : null);
    }
    draw();
    requestAnimationFrame(frame);
  }
  window.addEventListener('resize', resize); resize();
  showMenu();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
